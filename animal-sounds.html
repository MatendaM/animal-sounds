<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#87CEEB">
  <meta name="format-detection" content="telephone=no">
  <title>Animal Sounds</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: "Chalkboard SE", "Comic Sans MS", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #7ec8e8 0%, #b8e6ff 48%, #8fd18a 48%, #5aaa3a 100%);
      min-height: 100dvh;
      min-height: 100svh;
      position: relative;
    }

    .sky {
      position: fixed;
      inset: 0 0 52% 0;
      pointer-events: none;
      z-index: 0;
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.88);
      border-radius: 50px;
      animation: float 8s ease-in-out infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud-1 { width: 72px; height: 26px; top: 6%; left: 8%; }
    .cloud-1::before { width: 32px; height: 32px; top: -16px; left: 10px; }
    .cloud-1::after { width: 42px; height: 42px; top: -22px; left: 28px; }
    .cloud-2 { width: 90px; height: 30px; top: 10%; right: 6%; animation-delay: -3s; }
    .cloud-2::before { width: 38px; height: 38px; top: -18px; left: 14px; }
    .cloud-2::after { width: 48px; height: 48px; top: -26px; left: 36px; }
    .cloud-3 { width: 58px; height: 22px; top: 4%; left: 52%; animation-delay: -5s; }
    .cloud-3::before { width: 26px; height: 26px; top: -12px; left: 8px; }
    .cloud-3::after { width: 32px; height: 32px; top: -16px; left: 22px; }

    @keyframes float {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(10px); }
    }

    .grass {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 52%;
      background: linear-gradient(180deg, #8fd18a 0%, #5aaa3a 50%, #3d8b2e 100%);
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100dvh;
      height: 100svh;
      max-width: 720px;
      margin: 0 auto;
      padding:
        max(8px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 4px 4px;
    }

    .title {
      font-size: clamp(1.35rem, 5.5vw, 2rem);
      color: #fff;
      text-shadow: 2px 2px 0 #3f8fd4, 0 3px 8px rgba(0,0,0,0.18);
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 2px;
      font-size: clamp(0.85rem, 3.4vw, 1.1rem);
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.25);
      font-weight: 700;
    }

    .animals-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      gap: clamp(8px, 2.2vw, 16px);
    }

    .animal-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      background: #fff;
      border-radius: clamp(16px, 4vw, 24px);
      padding: clamp(6px, 1.8vw, 12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow:
        0 5px 0 var(--shadow-color, #ccc),
        0 8px 16px rgba(0,0,0,0.12);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    .animal-btn:active,
    .animal-btn.playing {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 var(--shadow-color, #ccc),
        0 3px 8px rgba(0,0,0,0.1);
    }

    .animal-btn.playing {
      background: #fffbe6;
    }

    .animal-svg {
      width: 72%;
      height: auto;
      max-height: 72%;
      flex: 1;
      min-height: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .animal-svg svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
    }

    .animal-name {
      font-size: clamp(0.85rem, 3.4vw, 1.15rem);
      font-weight: 700;
      color: #444;
      pointer-events: none;
      line-height: 1.1;
      flex-shrink: 0;
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.14); }
      60% { transform: scale(0.94); }
    }

    .animal-btn.bounce .animal-svg {
      animation: bounce 0.4s ease;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 220, 80, 0.45);
      transform: scale(0);
      animation: ripple 0.5s ease-out;
      pointer-events: none;
    }

    @keyframes ripple {
      to { transform: scale(2.6); opacity: 0; }
    }

    /* Landscape phones: 4 across, 2 down so everything still fits */
    @media (orientation: landscape) and (max-height: 560px) {
      .app { gap: 4px; }
      .header { padding: 0; }
      .subtitle { display: none; }
      .title { font-size: 1.15rem; }
      .animals-grid {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 8px;
      }
      .animal-name { font-size: 0.85rem; }
    }

    @media (max-height: 700px) {
      .subtitle { display: none; }
      .title { font-size: clamp(1.15rem, 5vw, 1.5rem); }
      .app { gap: 6px; }
    }

    @media (min-width: 700px) and (min-height: 700px) {
      .animals-grid {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="sky">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

    <header class="header">
      <h1 class="title">🎵 Animal Sounds</h1>
      <p class="subtitle">Tap an animal to hear it!</p>
    </header>
    <div id="animals-grid" class="animals-grid" aria-label="Animal sounds"></div>
  </main>

  <div class="grass"></div>

    const grid = document.getElementById("animals-grid");
    let currentAudio = null;
    let currentButton = null;

    function createRipple(button, event) {
      const rect = button.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      const x = (event.clientX || (event.touches && event.touches[0].clientX) || rect.left + rect.width / 2) - rect.left - size / 2;
      const y = (event.clientY || (event.touches && event.touches[0].clientY) || rect.top + rect.height / 2) - rect.top - size / 2;
      ripple.style.left = x + "px";
      ripple.style.top = y + "px";
      button.appendChild(ripple);
      ripple.addEventListener("animationend", () => ripple.remove());
    }

    function stopCurrentSound() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if (currentButton) {
        currentButton.classList.remove("playing");
        currentButton = null;
      }
    }

    function playAnimalSound(animal, button, event) {
      stopCurrentSound();
      button.classList.add("bounce", "playing");
      button.addEventListener("animationend", () => button.classList.remove("bounce"), { once: true });
      if (event) createRipple(button, event);

      const audio = new Audio(animal.sound);
      currentAudio = audio;
      currentButton = button;

      audio.addEventListener("ended", () => {
        button.classList.remove("playing");
        if (currentAudio === audio) {
          currentAudio = null;
          currentButton = null;
        }
      });

      audio.play().catch(() => button.classList.remove("playing"));
    }

    animals.forEach((animal) => {
      const button = document.createElement("button");
      button.className = "animal-btn";
      button.type = "button";
      button.setAttribute("aria-label", "Play " + animal.name + " sound");
      button.style.setProperty("--shadow-color", animal.shadow);
      button.innerHTML = '<div class="animal-svg">' + animal.svg + '</div><span class="animal-name">' + animal.name + "</span>";
      button.addEventListener("click", (event) => playAnimalSound(animal, button, event));
      grid.appendChild(button);
    });
